# This Docker Compose file will spin up an ACS community installation on a local
# host. It requires at least 6GB of memory available to distribute among
# containers.
#
# This setup uses the new batch-indexing component for search instead of the
# deprecated Solr search service (officially deprecated since ACS 26.2.0).
# However, the Solr endpoint is still required for content transformation. The
# solr.secureComms and solr.sharedSecret properties must be set to enable secure
# communication with Solr for transformations. The shared secret value must
# match between the Alfresco service (solr.sharedSecret) and the batch-indexing
# service (ALFRESCO_CONTENT_TRANSFORM_SHAREDSECRET).
#
# For performance tuning, adjust the mem_limit for each container based on available
# system resources, then use -XX:MinRAMPercentage and -XX:MaxRAMPercentage to control
# the JVM heap allocation. For example, setting mem_limit: 2000m and
# -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80 will allocate between 1000m and 1600m
# of heap to the JVM.
#
# Порты:
# - Traefik (Alfresco + Share + Content App): http://localhost:8082
# - Traefik Dashboard: http://localhost:8888
# - PostgreSQL: 5433
# - Elasticsearch: 9200, 9300
# - Kibana: 5601
# - ActiveMQ: 8161 (Admin), 5672 (AMQP), 61616 (OpenWire), 61613 (STOMP)
# - Transform Core AIO: 8090 (внутренний)
#
services:
  alfresco:
    image: docker.io/alfresco/alfresco-content-repository-community:26.2.0
    mem_limit: 1900m
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dindex.subsystem.name=elasticsearch
        -Delasticsearch.createIndexIfNotExists=true
        -Delasticsearch.host=elasticsearch
        -Delasticsearch.port=9200
        -Dshare.host=localhost:8082
        -Dshare.port=80
        -Dalfresco.host=localhost:8082
        -Dalfresco.port=80
        -Dcsrf.filter.enabled=false
        -Daos.baseUrlOverwrite=http://localhost:8082/alfresco/aos
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Dmessaging.broker.username=admin
        -Dmessaging.broker.password=admin
        -Ddeployment.method=DOCKER_COMPOSE
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 2m30s
    volumes:
      - alf_data:/usr/local/tomcat/alf_data
    depends_on:
      postgres:
        condition: service_started
      elasticsearch:
        condition: service_started
    extends:
      file: commons/base.yaml
      service: alfresco

  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:5.4.3
    mem_limit: 768m
    restart: unless-stopped
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 10s
    depends_on:
      activemq:
        condition: service_started

  share:
    image: docker.io/alfresco/alfresco-share:26.2.0
    mem_limit: 768m
    restart: unless-stopped
    environment:
      CSRF_FILTER_ORIGIN: http://localhost:8082
      CSRF_FILTER_REFERER: http://localhost:8082/share/.*
      REPO_HOST: "alfresco"
      REPO_PORT: "8080"
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dalfresco.context=alfresco
        -Dalfresco.protocol=http
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/share"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 1m30s
    depends_on:
      alfresco:
        condition: service_started
    extends:
      file: commons/base.yaml
      service: share

  postgres:
    image: postgres:17.9
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: alfresco
      POSTGRES_USER: alfresco
      POSTGRES_DB: alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d alfresco -U alfresco"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  elasticsearch:
    image: elasticsearch:8.17.10
    mem_limit: 768m
    restart: unless-stopped
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    ports:
      - 9200:9200
      - 9300:9300
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  kibana:
    image: kibana:8.17.10
    mem_limit: 1g
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_BASEPATH: ""
      SERVER_REWRITEBASEPATH: "false"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-o", "/dev/null", "http://localhost:5601/status"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 30s
    volumes:
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml

  batch-indexing:
    image: docker.io/alfresco/alfresco-elasticsearch-batch-indexing:5.7.0
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_started
      alfresco:
        condition: service_started
      transform-core-aio:
        condition: service_started
    environment:
      JAVA_OPTS: "-Xms256m -Xmx768m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alfresco
      SPRING_DATASOURCE_USERNAME: alfresco
      SPRING_DATASOURCE_PASSWORD: alfresco
      SPRING_ELASTICSEARCH_REST_URIS: http://elasticsearch:9200
      ALFRESCO_ACCEPTEDCONTENTMEDIATYPESCACHE_BASEURL: http://transform-core-aio:8090/transform/config
      ALFRESCO_ACS_URL: http://alfresco:8080
      ALFRESCO_CONTENT_TRANSFORM_SHAREDSECRET: secret
      ALFRESCO_REINDEX_CONTINUOUS_POLLINGINTERVAL: 15s
      ALFRESCO_REINDEX_CONTINUOUS_CATCHUPPOLLINGINTERVAL: 1s
      ALFRESCO_REINDEX_CONTINUOUS_MAXWINDOW: 30m
      ALFRESCO_REINDEX_CONTINUOUS_OVERLAP: 10m

  activemq:
    image: docker.io/alfresco/alfresco-activemq:6.2.6-jre17-rockylinux8
    mem_limit: 1g
    restart: unless-stopped
    environment:
      ACTIVEMQ_ADMIN_LOGIN: admin
      ACTIVEMQ_ADMIN_PASSWORD: admin
    ports:
      - "8161:8161"
      - "5672:5672"
      - "61616:61616"
      - "61613:61613"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8161/admin/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  content-app:
    image: alfresco/alfresco-content-app:8.0.0
    mem_limit: 128m
    restart: unless-stopped
    environment:
      APP_BASE_SHARE_URL: "http://localhost:8082/aca/#/preview/s"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 1s
      retries: 3
      start_period: 1s
    extends:
      file: commons/base.yaml
      service: content-app

  control-center:
    image: quay.io/alfresco/alfresco-control-center:11.0.0
    mem_limit: 128m
    restart: unless-stopped
    environment:
      APP_CONFIG_PROVIDER: "ECM"
      APP_CONFIG_AUTH_TYPE: "BASIC"
      BASE_PATH: ./
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 1s
      retries: 3
      start_period: 1s
    extends:
      file: commons/base.yaml
      service: control-center

  proxy:
    extends:
      file: commons/base.yaml
      service: proxy

volumes:
  alf_data:
  postgres_data:
  elasticsearch_data:
